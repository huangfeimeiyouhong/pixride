<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>像素骑行 · 滇藏线 | 骑行被狗追</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="像素骑行" />
<meta name="theme-color" content="#0b0d17" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0b0d17;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    position: fixed; inset: 0;
    background: #0b0d17;
  }
  #game {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #070910;
    touch-action: none;
    display: block;
  }
  .fsbtn {
    position: fixed;
    right: calc(10px + env(safe-area-inset-right, 0px));
    top: calc(10px + env(safe-area-inset-top, 0px));
    width: 36px; height: 36px; line-height: 34px;
    text-align: center; font-size: 16px; color: #cfe3ff;
    background: rgba(11, 13, 23, 0.72); border: 1px solid #2a3350;
    border-radius: 9px; z-index: 20; user-select: none;
    font-family: sans-serif;
  }
  .err {
    position: fixed; left: 12px; right: 12px; top: 12px; z-index: 30;
    color: #ffd0d0; font: 12px/1.5 monospace; white-space: pre-wrap;
    background: rgba(60, 0, 0, 0.8); padding: 8px 10px; border-radius: 8px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 与抖音小游戏共用同一套核心模块（加载顺序即依赖顺序） -->
<script src="../src/core/sys.js"></script>
<script src="../src/core/raf.js"></script>
<script src="../src/core/config.js"></script>
<script src="../src/core/gfx.js"></script>
<script src="../src/core/sprites.js"></script>
<script src="../src/core/props.js"></script>
<script src="../src/core/themes.js"></script>
<script src="../src/core/input.js"></script>
<script src="../src/core/synth.js"></script>
<script src="../src/core/audio.js"></script>
<script src="../src/world/terrain.js"></script>
<script src="../src/world/background.js"></script>
<script src="../src/entities/obstacle.js"></script>
<script src="../src/entities/item.js"></script>
<script src="../src/entities/player.js"></script>
<script src="../src/entities/dog.js"></script>
<script src="../src/world/level.js"></script>
<script src="../src/game/save.js"></script>
<script src="../src/game/particles.js"></script>
<script src="../src/game/fx.js"></script>
<script src="../src/game/hud.js"></script>
<script src="../src/game/screens.js"></script>
<script src="../src/game/main.js"></script>
<script>
(function () {
  var canvas = document.getElementById('game');
  function fail(e) {
    var d = document.createElement('div');
    d.className = 'err';
    d.textContent = '加载出错：' + (e && (e.stack || e.message) || e);
    document.body.appendChild(d);
  }
  // 手机浏览器：首次触摸后尝试全屏（浏览器要求在全屏请求前有用户激活，且 touchstart 不算，要用 touchend / click）
  function lockLandscape() {
    try {
      if (screen.orientation && screen.orientation.lock) {
        var p = screen.orientation.lock('landscape');
        if (p && p.catch) p.catch(function () {});
      } else if (screen.lockOrientation) screen.lockOrientation('landscape');
    } catch (e) {}
  }
  function enterFullscreen() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (!fn) return;
    try { var p = fn.call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    lockLandscape();
  }
  var gesture = function () {
    var standalone = (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches)) || window.navigator.standalone === true;
    if (standalone) { lockLandscape(); return; }
    enterFullscreen();
    document.removeEventListener('touchend', gesture, true);
    document.removeEventListener('click', gesture, true);
  };
  document.addEventListener('touchend', gesture, true);
  document.addEventListener('click', gesture, true);

  try {
    PR.input.init(canvas);
    PR.audio.init();
    var game = new PR.Game({ canvas: canvas });
    window.__pixelRide = game;
    game.start();
    window.addEventListener('resize', function () { game.resize(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) game.autoPause(); else game.autoResume();
    });
  } catch (e) { fail(e); }
})();
</script>
</body>
</html>
